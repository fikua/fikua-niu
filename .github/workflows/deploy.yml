name: Deploy Niu to VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (defaults to "latest")'
        required: false
        default: 'latest'
        type: string
  release:
    types: [published]

# Don't run two deploys at once against the same VPS.
concurrency:
  group: deploy-niu-prd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag || github.event.release.tag_name || 'latest' }} to prd
    runs-on: ubuntu-latest
    # The 'prd' environment is configured with required reviewers in
    # Settings -> Environments -> prd. Until somebody approves the run,
    # the job stays paused, so an autotrigger from a release publish
    # does not ship to production unsupervised.
    #
    # IMPORTANT: this environment's url assumes Cloudflare Access is
    # already configured in front of niu.fikua.com (S10, PLAN.md §3).
    # Do not enable this workflow's automatic trigger in the repo
    # settings until that policy exists — see
    # fikua-platform-iac/projects/niu/README.md for the exact manual
    # steps and current status.
    environment:
      name: prd
      url: https://niu.fikua.com/healthz

    steps:
      - name: Checkout (for the compose file)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install cloudflared
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH client (tunnel + key + known_hosts)
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_id
          chmod 600 ~/.ssh/vps_id
          ssh-keygen -y -f ~/.ssh/vps_id >/dev/null

          cat <<'EOF' > ~/.ssh/config
          Host vps.fikua.com
              User ubuntu
              IdentityFile ~/.ssh/vps_id
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
              ProxyCommand cloudflared access ssh --hostname %h
              ServerAliveInterval 30
              ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

          echo "CF_ACCESS_CLIENT_ID=$CF_ACCESS_CLIENT_ID" >> "$GITHUB_ENV"
          echo "CF_ACCESS_CLIENT_SECRET=$CF_ACCESS_CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: Copy compose.yaml from platform-iac source of truth
        # The compose file lives in the platform-iac repo, but to keep
        # this workflow self-contained we ship the same file alongside
        # the app under app/compose.yaml; if it isn't present yet we
        # fall back to whatever is already on the VPS.
        run: |
          if [ -f app/compose.yaml ]; then
            scp app/compose.yaml vps.fikua.com:/tmp/niu-compose.yaml
            ssh vps.fikua.com 'sudo mkdir -p /opt/vps/projects/niu && sudo cp /tmp/niu-compose.yaml /opt/vps/projects/niu/compose.yaml && sudo chown ubuntu:ubuntu /opt/vps/projects/niu/compose.yaml'
          else
            echo "::notice::app/compose.yaml not present in the app repo — keeping the on-host compose file as is."
          fi

      - name: Pull and restart on the VPS
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.event.release.tag_name || 'latest' }}
        run: |
          NORMALISED_TAG="${IMAGE_TAG#v}"
          echo "Deploying fikua/niu:$NORMALISED_TAG"
          ssh vps.fikua.com "
            set -e
            cd /opt/vps/projects/niu
            NIU_VERSION='$NORMALISED_TAG' sudo --preserve-env=NIU_VERSION docker compose pull niu
            NIU_VERSION='$NORMALISED_TAG' sudo --preserve-env=NIU_VERSION docker compose up -d
          "

      - name: Wait for /healthz to report ok
        # The image is distroless (no shell, no wget/curl inside the
        # container), and the container publishes no host port — reach
        # it by sharing its network namespace from a throwaway curl
        # container instead of `docker exec`.
        run: |
          for i in $(seq 1 30); do
            body=$(ssh vps.fikua.com 'sudo docker run --rm --network container:niu curlimages/curl:latest -sf http://127.0.0.1:8080/healthz' || true)
            echo "attempt $i: $body" | head -c 400
            echo
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "/healthz is ok"
              exit 0
            fi
            sleep 5
          done
          echo "/healthz did not report ok within 150s"
          exit 1

      - name: Smoke-test through Traefik (Host header)
        run: |
          ssh vps.fikua.com \
            'curl -sIk -H "Host: niu.fikua.com" https://127.0.0.1/healthz | head -5'
