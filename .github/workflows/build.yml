name: Build & test (niu)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Vet, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: niu
          POSTGRES_PASSWORD: niu
          POSTGRES_DB: niu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niu" --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test
        env:
          TEST_DATABASE_URL: postgres://niu:niu@localhost:5432/niu_test?sslmode=disable
        run: go test -count=1 ./...
